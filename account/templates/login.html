{% extends "partials/pub_layout.html" %}

{% block content %}
<main class="flex min-h-[65svh] items-center justify-center bg-base-200 px-4 py-10 sm:px-6">
    <section class="card w-full max-w-md border border-base-300 bg-base-100 shadow-sm">
        <div class="card-body gap-5 p-5 sm:p-8">
            <header>
                <p class="text-sm font-semibold uppercase tracking-[0.14em] text-primary">Your ResortEase account</p>
                <h1 class="mt-2 font-serif text-3xl font-medium">Welcome back</h1>
                <p class="mt-2 text-sm text-base-content/70">Sign in to review reservations and manage your account.</p>
            </header>
            {% if error %}<div role="alert" class="alert alert-error">{{ error }}</div>{% endif %}
            <form class="flex flex-col gap-4" action="{% url 'login' %}" method="post">
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <label class="form-control w-full">
                    <span class="label"><span class="label-text font-medium">Username</span></span>
                    <input type="text" id="username" name="username" class="input input-bordered w-full" autocomplete="username" required />
                </label>
                <label class="form-control w-full">
                    <span class="label flex justify-between">
                        <span class="label-text font-medium">Password</span>
                        <a href="{% url 'forgot-password' %}" class="link link-hover label-text-alt">Forgot password?</a>
                    </span>
                    <input type="password" id="password" name="password" class="input input-bordered w-full" autocomplete="current-password" required />
                </label>
                <button type="submit" class="btn btn-primary mt-2 w-full">Sign in</button>
            </form>
            <p class="text-center text-sm text-base-content/70">New to ResortEase? <a class="link link-primary font-medium" href="{% url 'sign-up' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
        </div>
    </section>
</main>
{% endblock %}
