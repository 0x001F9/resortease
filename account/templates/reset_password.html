<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% load static %}
  <link href="{% static 'dist/output.css' %}" rel="stylesheet" type="text/css" />
  <title>ResortEase | Reset password</title>
</head>
<body class="bg-muted min-h-svh p-6 md:p-10">
  <main class="mx-auto flex min-h-svh max-w-md items-center justify-center">
    <section class="card w-full bg-base-100 shadow-sm">
      <div class="card-body gap-4">
        <div class="text-center">
          <h1 class="text-2xl font-bold">Reset password</h1>
          <p class="py-2 text-sm text-base-content/70">Use the code we emailed you to set a new password.</p>
        </div>

        <form method="post" class="flex flex-col gap-4">
          {% csrf_token %}
          <fieldset class="fieldset">
            <label class="label" for="email">Email</label>
            <input id="email" type="email" name="email" value="{{ email|default:'' }}" class="input input-bordered w-full" required />
          </fieldset>
          <fieldset class="fieldset">
            <label class="label" for="otp_code">One-time password</label>
            <input id="otp_code" type="text" name="otp_code" class="input input-bordered w-full" inputmode="numeric" maxlength="6" required />
          </fieldset>
          <fieldset class="fieldset">
            <label class="label" for="password">New password</label>
            <input id="password" type="password" name="password" class="input input-bordered w-full" required />
          </fieldset>
          <fieldset class="fieldset">
            <label class="label" for="confirm_password">Confirm new password</label>
            <input id="confirm_password" type="password" name="confirm_password" class="input input-bordered w-full" required />
          </fieldset>
          <button type="submit" class="btn btn-primary w-full">Reset password</button>
        </form>

        {% if error %}
          <div class="alert alert-error mt-2">{{ error }}</div>
        {% endif %}
      </div>
    </section>
  </main>
</body>
</html>
