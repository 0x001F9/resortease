{% extends "partials/pub_layout.html" %}

{% block content %}
<main class="flex min-h-[65svh] items-center justify-center bg-base-200 px-4 py-10 sm:px-6">
    <section class="card w-full max-w-md border border-base-300 bg-base-100 shadow-sm">
        <div class="card-body gap-5 p-5 sm:p-8">
            <header>
                <p class="text-sm font-semibold uppercase tracking-[0.14em] text-primary">Account access</p>
                <h1 class="mt-2 font-serif text-3xl font-medium">Choose a new password</h1>
                <p class="mt-2 text-sm leading-relaxed text-base-content/70">Use the code sent to {{ masked_email }} to finish resetting your password.</p>
            </header>
            {% if error %}<div role="alert" class="alert alert-error">{{ error }}</div>{% endif %}
            <form method="post" class="flex flex-col gap-4">
                {% csrf_token %}
                <label class="form-control w-full">
                    <span class="label"><span class="label-text font-medium">One-time password</span></span>
                    <input id="otp_code" type="text" name="otp_code" class="input input-bordered w-full" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required />
                </label>
                <label class="form-control w-full">
                    <span class="label"><span class="label-text font-medium">New password</span></span>
                    <input id="password" type="password" name="password" class="input input-bordered w-full" autocomplete="new-password" required />
                </label>
                <label class="form-control w-full">
                    <span class="label"><span class="label-text font-medium">Confirm new password</span></span>
                    <input id="confirm_password" type="password" name="confirm_password" class="input input-bordered w-full" autocomplete="new-password" required />
                </label>
                <button type="submit" class="btn btn-primary w-full">Reset password</button>
            </form>
        </div>
    </section>
</main>
{% endblock %}
