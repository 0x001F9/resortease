<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% load static %}
  <link href="{% static 'dist/output.css' %}" rel="stylesheet" type="text/css" />
  <title>ResortEase | Setup TOTP</title>
</head>
<body class="bg-muted min-h-svh p-6 md:p-10">
  <main class="mx-auto flex min-h-svh max-w-lg items-center justify-center">
    <div class="w-full max-w-md text-center">
      <h1 class="text-2xl font-bold">Set up TOTP</h1>
      <p class="py-2 text-sm text-base-content/70">Scan the QR code with your authenticator app.</p>

      {% if error %}
        <div class="alert alert-error my-4">{{ error }}</div>
      {% endif %}

      <div class="flex justify-center">
        <img src="{{ qr_code_data_url }}" alt="TOTP QR code" class="mx-auto block max-w-52 bg-white p-2" />
      </div>

      <form method="post" class="mt-6 flex flex-col gap-4">
        {% csrf_token %}
        <fieldset class="fieldset">
          <label class="label" for="code">Verification code</label>
          <input id="code" type="text" name="code" class="input input-bordered w-full" inputmode="numeric" maxlength="6" required />
        </fieldset>
        <button type="submit" class="btn btn-primary w-full">Enable TOTP</button>
      </form>
    </div>
  </main>
</body>
</html>
