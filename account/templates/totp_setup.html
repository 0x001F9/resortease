{% extends "partials/pub_layout.html" %}

{% block content %}
<main class="mx-auto flex py-10 max-w-lg items-center justify-center">
  <div class="w-full max-w-md text-center">
    <h1 class="text-2xl font-bold">{% if is_changing_totp %}Change authenticator app{% else %}Set up TOTP{% endif %}</h1>
    <p class="py-2 text-sm text-base-content/70">Scan the QR code with your authenticator app.</p>

    {% if error %}
      <div class="alert alert-error my-4">{{ error }}</div>
    {% endif %}

    <div class="flex justify-center">
      <img src="{{ qr_code_data_url }}" alt="TOTP QR code" class="mx-auto block max-w-52 bg-white p-2" />
    </div>

    <form method="post" class="mt-6 flex flex-col gap-4">
      {% csrf_token %}
      <fieldset class="fieldset">
        <label class="label" for="code">Verification code</label>
        <input id="code" type="text" name="code" class="input input-bordered w-full" inputmode="numeric" maxlength="6" required />
      </fieldset>
      <button type="submit" class="btn btn-primary w-full">{% if is_changing_totp %}Update authenticator{% else %}Enable TOTP{% endif %}</button>
    </form>
    <a href="{% url 'user-settings' request.user.username %}" class="btn btn-ghost mt-3 w-full">Cancel</a>
  </div>
</main>
{% endblock %}
