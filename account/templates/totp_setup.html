{% extends "partials/pub_layout.html" %}

{% block content %}
<main class="flex min-h-[65svh] items-center justify-center bg-base-200 px-4 py-10 sm:px-6">
  <section class="card w-full max-w-md border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body gap-5 p-5 sm:p-8">
      <header>
        <p class="text-sm font-semibold uppercase tracking-[0.14em] text-primary">Account security</p>
        <h1 class="mt-2 font-serif text-3xl font-medium">{% if is_changing_totp %}Change authenticator app{% else %}Set up TOTP{% endif %}</h1>
        <p class="mt-2 text-sm text-base-content/70">Scan the QR code with your authenticator app.</p>
      </header>

    {% if error %}
      <div class="alert alert-error my-4">{{ error }}</div>
    {% endif %}

      <div class="flex justify-center rounded-box border border-base-300 bg-white p-4">
        <img src="{{ qr_code_data_url }}" alt="TOTP QR code" class="mx-auto block max-w-52" />
      </div>

    <form method="post" class="mt-6 flex flex-col gap-4">
      {% csrf_token %}
      <fieldset class="fieldset">
        <label class="label" for="code">Verification code</label>
        <input id="code" type="text" name="code" class="input input-bordered w-full" inputmode="numeric" maxlength="6" required />
      </fieldset>
      <button type="submit" class="btn btn-primary w-full">{% if is_changing_totp %}Update authenticator{% else %}Enable TOTP{% endif %}</button>
    </form>
      <a href="{% url 'user-settings' request.user.username %}" class="btn btn-ghost w-full">Cancel</a>
    </div>
  </section>
</main>
{% endblock %}
