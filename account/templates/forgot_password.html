<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% load static %}
  <link href="{% static 'dist/output.css' %}" rel="stylesheet" type="text/css" />
  <title>ResortEase | Forgot password</title>
</head>
<body class="bg-muted min-h-svh p-6 md:p-10">
  <main class="mx-auto flex min-h-svh max-w-md items-center justify-center">
    <section class="card w-full bg-base-100 shadow-sm">
      <div class="card-body gap-4">
        <div class="text-center">
          <h1 class="text-2xl font-bold">Forgot password</h1>
          <p class="py-2 text-sm text-base-content/70">Enter your email and we’ll send a one-time password reset code.</p>
        </div>

        <form method="post" class="flex flex-col gap-4">
          {% csrf_token %}
          <fieldset class="fieldset">
            <label class="label" for="email">Email</label>
            <input id="email" type="email" name="email" class="input input-bordered w-full" required />
          </fieldset>
          <button type="submit" class="btn btn-primary w-full">Send reset code</button>
        </form>

        <div class="text-center text-sm">
          <a href="{% url 'login' %}" class="link">Back to login</a>
        </div>

        {% if error %}
          <div class="alert alert-error mt-2">{{ error }}</div>
        {% endif %}
      </div>
    </section>
  </main>
</body>
</html>
