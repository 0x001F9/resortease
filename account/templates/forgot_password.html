{% extends "partials/pub_layout.html" %}

{% block content %}
<main class="flex min-h-[65svh] items-center justify-center bg-base-200 px-4 py-10 sm:px-6">
    <section class="card w-full max-w-md border border-base-300 bg-base-100 shadow-sm">
        <div class="card-body gap-5 p-5 sm:p-8">
            <header>
                <p class="text-sm font-semibold uppercase tracking-[0.14em] text-primary">Account access</p>
                <h1 class="mt-2 font-serif text-3xl font-medium">Reset your password</h1>
                <p class="mt-2 text-sm leading-relaxed text-base-content/70">Enter your account email and we’ll send a one-time reset code.</p>
            </header>
            {% if error %}<div role="alert" class="alert alert-error">{{ error }}</div>{% endif %}
            <form method="post" class="flex flex-col gap-4">
                {% csrf_token %}
                <label class="form-control w-full">
                    <span class="label"><span class="label-text font-medium">Email</span></span>
                    <input id="email" type="email" name="email" class="input input-bordered w-full" autocomplete="email" required />
                </label>
                <button type="submit" class="btn btn-primary w-full">Send reset code</button>
            </form>
            <a href="{% url 'login' %}" class="btn btn-ghost btn-sm self-start">Back to sign in</a>
        </div>
    </section>
</main>
{% endblock %}
