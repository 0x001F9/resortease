{% extends "partials/pub_layout.html" %}

{% block content %}
<main class="flex min-h-[60vh] items-center justify-center px-6 py-12">
    <section class="card w-full max-w-xl border border-base-300 bg-base-100 shadow-xl">
        <div class="card-body items-center text-center">
            <div class="mb-2 flex size-16 items-center justify-center rounded-full bg-warning/20 text-warning">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4M9 9v.01M9 12v.01M9 15v.01M9 18v.01M15 12v.01M15 15v.01M15 18v.01" />
                </svg>
            </div>
            <h1 class="card-title text-2xl">You don't have any branch yet</h1>
            {% if request.user.is_user_superuser %}
                <p class="text-base-content/70">
                    Add a branch to get started with your resort operations.
                </p>
                <div class="card-actions mt-4">
                    <a href="/admin/dashboard/branch/add/">
                        <button type="button" class="btn btn-primary">Add a branch</button>
                    </a>
                </div>
            {% else %}
                <p class="text-base-content/70">
                    Please contact IT or a superuser to add a branch.
                </p>
            {% endif %}
        </div>
    </section>
</main>
{% endblock %}
