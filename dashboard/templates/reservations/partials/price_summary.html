<section
    class="rounded-box border border-base-300 bg-base-200/30 p-4 sm:col-span-2 sm:p-5"
    data-price-preview
    aria-labelledby="price-preview-title"
    aria-live="polite"
>
    <header class="mb-4 flex items-center justify-between gap-4">
        <div>
            <h2 id="price-preview-title" class="font-semibold">Price summary</h2>
            <p class="text-xs text-base-content/60">Estimated reservation cost</p>
        </div>
        <span class="badge badge-ghost">Estimate</span>
    </header>
    <p class="mb-3 text-sm text-base-content/60" data-price-status>
        Choose a facility and rate-matching timeslot to preview the amount.
    </p>
    <dl class="space-y-2">
        <div class="flex justify-between gap-4">
            <dt class="text-base-content/70">Raw amount</dt>
            <dd class="font-medium" data-price-raw>—</dd>
        </div>
        <div class="flex justify-between gap-4">
            <dt class="text-base-content/70">Discount</dt>
            <dd class="font-medium text-success" data-price-discount>−₱0.00</dd>
        </div>
        <div class="flex justify-between gap-4 border-t border-base-300 pt-3">
            <dt class="font-semibold">Total amount</dt>
            <dd class="text-xl font-bold text-primary" data-price-total>—</dd>
        </div>
    </dl>
</section>
