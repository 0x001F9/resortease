<div
    class="form-control w-full"
    data-user-picker
    data-search-url="{% url 'search-reservation-guests' request.branch.slug %}"
>
    <span class="label">
        <span class="label-text font-medium">Guest <span class="text-error">*</span></span>
    </span>
    <input type="hidden" name="guest" value="{{ form_data.guest|default:'' }}" data-user-picker-id>
    <button
        type="button"
        class="btn btn-outline w-full justify-start {% if errors.guest %}btn-error{% endif %}"
        data-user-picker-open
        aria-haspopup="dialog"
        aria-controls="reservation-guest-picker"
        {% if not has_guests %}disabled{% endif %}
    >
        <span data-user-picker-selection>
            {% if selected_guest %}
                {{ selected_guest.first_name }}{% if selected_guest.middle_name %} {{ selected_guest.middle_name }}{% endif %} {{ selected_guest.last_name }} ({{ selected_guest.email }})
            {% else %}
                Choose a guest
            {% endif %}
        </span>
    </button>
    <span class="mt-1 text-sm text-error" data-user-picker-error {% if not errors.guest %}hidden{% endif %}>
        {{ errors.guest|default:"Select an active user." }}
    </span>

    <dialog
        id="reservation-guest-picker"
        class="modal"
        data-user-picker-dialog
        aria-labelledby="reservation-guest-picker-title"
    >
        <div class="modal-box max-h-[85svh] w-[calc(100%_-_2rem)] max-w-xl p-4 sm:p-6">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <h2 id="reservation-guest-picker-title" class="text-lg font-semibold">Find a guest</h2>
                    <p class="mt-1 text-sm text-base-content/70">Search by name, username, or email.</p>
                </div>
                <button type="button" class="btn btn-ghost btn-sm" data-user-picker-close aria-label="Close">✕</button>
            </div>
            <input
                type="search"
                class="input input-bordered mt-4 w-full"
                placeholder="Search name, username, or email"
                autocomplete="off"
                data-user-picker-search
            >
            <p class="py-4 text-sm text-base-content/70" aria-live="polite" data-user-picker-status>Enter a name, username, or email to search.</p>
            <ul class="max-h-72 space-y-2 overflow-y-auto" data-user-picker-results></ul>
        </div>
        <div class="modal-backdrop">
            <button type="button" aria-label="Close" data-user-picker-backdrop></button>
        </div>
    </dialog>
</div>
