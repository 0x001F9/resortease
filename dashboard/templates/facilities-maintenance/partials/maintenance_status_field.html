<label class="form-control w-full">
    <span class="label">
        <span class="label-text font-medium">Status <span class="text-error">*</span></span>
    </span>
    <select name="status" class="select select-bordered w-full {% if errors.status %}select-error{% endif %}" required>
        <option value="pending" {% if form_data.status == "pending" %}selected{% endif %}>Pending</option>
        <option value="in_progress" {% if form_data.status == "in_progress" %}selected{% endif %}>In progress</option>
        <option value="completed" {% if form_data.status == "completed" %}selected{% endif %}>Completed</option>
        <option value="cancelled" {% if form_data.status == "cancelled" %}selected{% endif %}>Cancelled</option>
    </select>
    {% if errors.status %}
        <span class="mt-1 text-sm text-error">{{ errors.status }}</span>
    {% endif %}
</label>
