services:
  mysql:
    image: mysql:9.7.2
    container_name: resortease-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: resortease
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: