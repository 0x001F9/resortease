{% extends "partials/pub_layout.html" %}

{% block content %}
<main class="min-h-[80vh] flex items-center justify-center px-6 py-16">
    <div class="max-w-xl w-full text-center">
        <div class="relative mb-8">
            <h1 class="text-[10rem] md:text-[13rem] font-black leading-none tracking-tighter text-base-300 select-none">
                404
            </h1>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="badge badge-primary badge-lg font-semibold px-4 py-3">
                    Page Not Found
                </div>
            </div>
        </div>

        <h2 class="text-3xl md:text-4xl font-bold tracking-tight mb-4">
            Oops! Lost your way?
        </h2>

        <p class="text-base-content/60 text-base md:text-lg leading-relaxed mb-8">
            The page you're looking for doesn't exist, may have been moved,
            or is temporarily unavailable.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="/" class="btn btn-primary w-full sm:w-auto px-8">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7"/>
                    <path d="M9 22V12h6v10"/>
                    <path d="M3 10v12h18V10"/>
                </svg>
                Back to Home
            </a>

            <button onclick="history.back()" class="btn btn-outline w-full sm:w-auto px-8">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 19-7-7 7-7"/>
                    <path d="M19 12H5"/>
                </svg>
                Go Back
            </button>
        </div>

        <div class="divider my-10"></div>

        <p class="text-sm text-base-content/40">
            Error Code: 404 · Page Not Found
        </p>
    </div>
</main>
{% endblock %}
